<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="register.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link  href='https://fonts.googleapis.com/css?family=Aclonica' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sofia&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-box">
        <form action="#" class="form">
            <h2 id="h2">Registration for <br> the studies.</h2>
            <div>
                <div class="input-box">
                    <span class="icon"><i class="material-icons">person</i></span>
                    <input type="text" id="Names" required>
                    <label for="Names">Names</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="material-icons">group</i></span>
                    <input type="type" id="type" required>
                    <label for="type">Parents names</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="material-icons">phone</i></span>
                    <input type="number" id="number" required>
                    <label for="type">Parents contact</label>
                </div>
                <div class="input-box">
                    <span class="icon"></span>
                    <input type="file" id="file" required>
                    <label for="type">Term one report</label>
                </div>
                <div class="input-box">
                    <span class="icon"></span>
                    <input type="file" id="file" required>
                    <label for="type">Term two report</label>
                </div>
                <div class="input-box">
                    <span class="icon"></span>
                    <input type="text" id="Class" required>
                    <label for="Class">Class</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="material-icons">school</i></span>
                    <input type="type" id="type" required>
                    <label for="type">Previous school</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class="material-icons">phone</i></span>
                    <input type="password" id="pass" required>
                    <label for="pass">School contacts</label>
                </div>
                <div class="input-box">
                    <span class="icon"></span>
                    <input type="text" id="Class" required>
                    <label for="Class">Class</label>
                </div>
            </div>
            <button type="submit">Register</button>
            <div class="register-link">
                <p>Already registered. So login <a href="#">Login</a></p>
            </div>
        </form>
    </div>
    <script>
        // Listen for changes to the file input
        document.getElementById('file-upload').addEventListener('change', function(event) {
          const fileName = event.target.files[0]?.name || 'No file chosen';
          document.querySelector('.custom-file-label').textContent = fileName;
        });
      </script>
</body>
</html>
