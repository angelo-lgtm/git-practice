<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link  href='https://fonts.googleapis.com/css?family=Aclonica' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sofia&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-box">
        <form action="#">
            <h2 id="h2">Student login form</h2>
            <div class="input-box">
                <span class="icon"><i class="material-icons">person</i></span>
                <input type="text" id="Names" required>
                <label for="Names">Names</label>
            </div>
            <div class="input-box">
                <span class="icon"></span>
                <input type="text" id="Class" required>
                <label for="Class">Class</label>
            </div>
            <div class="input-box">
                <span class="icon"><i class="glyphicon glyphicon-envelope"></i></span>
                <input type="email" id="email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-box">
                <span class="icon"><i class="glyphicon glyphicon-lock"></i></span>
                <input type="password" id="pass" required>
                <label for="pass">Password</label>
            </div>
            <div class="remember-forgot">
                <label for=""><input type="radio">Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit">Login</button>
            <div class="register-link">
                <p>Register to study in the school <a href="#">Register</a></p>
            </div>
        </form>
    </div>
</body>
</html>
